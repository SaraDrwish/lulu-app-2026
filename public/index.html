<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: التطبيق ياخد الشاشة كلها حوالين النوتش. maximum-scale=1: الشاشة متعملش زوم لما تكتبي -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>لولو</title>

    <!-- عشان يتثبت على الشاشة الرئيسية ويفتح كتطبيق -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#FF8FAB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="لولو" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <style id="expo-reset">
      html, body { height: 100%; }
      body {
        overflow: hidden;
        margin: 0;
        background: #FFF1F4;
        overscroll-behavior: none;          /* من غير "مطاطية" لما تسحبي */
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;         /* من غير زوم بالضغطتين */
      }
      @media (prefers-color-scheme: dark) { body { background: #1D1320; } }
      input, textarea { -webkit-user-select: text; user-select: text; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>لولو محتاجة JavaScript تكون شغالة 🌸</noscript>
    <div id="root"></div>
    <script>
      // بيطلب من المتصفح ميمسحش بيانات لولو
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      // بيخلي التطبيق يفتح حتى من غير نت بعد أول مرة
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js', { scope: './' });
        });
      }
    </script>
  </body>
</html>
